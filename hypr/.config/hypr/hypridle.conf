general {
    # pidof guard prevents a second hyprlock spawning over an existing one
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # without this the screen stays blank after waking from suspend
    after_sleep_cmd = hyprctl dispatch dpms on
}

listener {
    timeout = 500
    on-timeout = loginctl lock-session
}
